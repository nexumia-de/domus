# One workflow for the whole repository. The job `changes` works out which
# parts a pull request touches, so a change to one app does not run the
# others. Pushes to main run everything.
#
# Parts: model (packages/model), mixtura, culina, emptio (apps/<name>).
# Mixtura and Culina install the model from this repository, so a model
# change runs them too. Emptio does not use the model yet.
#
# Deploys: mixtura-deploy-cloudflare (preview on pull requests, production on
# main) and culina-deploy (main only); each deploys only its own app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides which parts run. A path that belongs to no part (root config,
  # scripts, workflows, anything unknown) runs all of them, so a mistake
  # costs time and not a missed check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      model: ${{ steps.paths.outputs.model }}
      mixtura: ${{ steps.paths.outputs.mixtura }}
      culina: ${{ steps.paths.outputs.culina }}
      emptio: ${{ steps.paths.outputs.emptio }}
    steps:
      # Full history so the base of a pull request is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the parts a change touches
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          model=false; mixtura=false; culina=false; emptio=false
          if [ "$EVENT" != "pull_request" ]; then
            model=true; mixtura=true; culina=true; emptio=true
          else
            # HEAD is the merge of the pull request into its base, so this
            # lists what the pull request changes.
            git diff --name-only "$BASE" HEAD > changed.txt
            echo "Changed files:"; cat changed.txt
            while IFS= read -r file; do
              case "$file" in
                apps/mixtura/*) mixtura=true ;;
                apps/culina/*) culina=true ;;
                apps/emptio/*) emptio=true ;;
                packages/model/*) model=true; mixtura=true; culina=true ;;
                LICENSE | *.md) ;;
                *) model=true; mixtura=true; culina=true; emptio=true ;;
              esac
            done < changed.txt
          fi
          {
            echo "model=$model"
            echo "mixtura=$mixtura"
            echo "culina=$culina"
            echo "emptio=$emptio"
          } | tee -a "$GITHUB_OUTPUT"

  # Prettier over the root files and the check that no part reaches into
  # another. Cheap, so it always runs.
  root-checks:
    name: root-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run boundaries

  model-check:
    name: model-check
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:model

  # What an app did when it installed the model from git: npm packs this
  # commit (running prepare) and installs the result into an empty project,
  # which then imports the entry.
  model-pack-install:
    name: model-pack-install
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node packages/model/scripts/consumer-check.mjs

  mixtura-check:
    name: mixtura-check
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:mixtura
      # The build of this commit, for the deploy job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixtura-dist
          path: apps/mixtura/packages/app/dist
          retention-days: 3
          if-no-files-found: error

  mixtura-e2e:
    name: mixtura-e2e
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w mixtura

  # The same scripts on a slow device: CPU slowed 4 times, animation frames
  # delayed by 100 ms (apps/mixtura/docs/development.md#slow-device-pass). Not a required check.
  mixtura-e2e-slow:
    name: mixtura-e2e-slow
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w mixtura
      - run: npm run e2e:slow -w @mixtura/app

  # The WebDAV adapter against the real server of apps/mixtura/tools/webdav-server: the
  # integration test in Node, e2e/webdav.mjs and, with a second server, e2e/sync.mjs in a
  # browser (apps/mixtura/docs/sync-backends.md). The same Node test also runs against the nginx
  # and Caddy fronts of apps/mixtura/tools/webdav-front (apps/mixtura/docs/sync-setup.md).
  # Not a required check unless the owner adds it to the ruleset.
  mixtura-webdav:
    name: mixtura-webdav
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    env:
      MIXTURA_WEBDAV_URL: http://127.0.0.1:8080
      MIXTURA_WEBDAV_URL_2: http://127.0.0.1:8081
      MIXTURA_WEBDAV_USER: mixtura
      MIXTURA_WEBDAV_PASSWORD: ci-only-password
      WEBDAV_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose --profile second up -d
        working-directory: apps/mixtura/tools/webdav-server
      - name: Wait for the servers
        run: |
          curl -sS --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null "$MIXTURA_WEBDAV_URL/"
          curl -sS --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null "$MIXTURA_WEBDAV_URL_2/"
      - run: npm run build -w mixtura
      - run: npx vitest run test/sync-webdav-integration.test.ts
        working-directory: apps/mixtura/packages/app
      - run: node e2e/webdav.mjs 360 720
        working-directory: apps/mixtura/packages/app
      - run: node e2e/webdav.mjs 1200 800
        working-directory: apps/mixtura/packages/app
      - run: node e2e/sync.mjs 360 720
        working-directory: apps/mixtura/packages/app
      - run: node e2e/sync.mjs 1200 800
        working-directory: apps/mixtura/packages/app
      - run: docker compose --profile nginx --profile caddy up -d
        working-directory: apps/mixtura/tools/webdav-front
      - name: Wait for the fronts
        run: |
          curl -sS --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null http://127.0.0.1:8090/
          curl -sS --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -o /dev/null http://127.0.0.1:8091/
      - run: MIXTURA_WEBDAV_URL=http://127.0.0.1:8090 npx vitest run test/sync-webdav-integration.test.ts
        working-directory: apps/mixtura/packages/app
      - run: MIXTURA_WEBDAV_URL=http://127.0.0.1:8091 npx vitest run test/sync-webdav-integration.test.ts
        working-directory: apps/mixtura/packages/app
      - name: Server log
        if: failure()
        run: docker compose --profile second logs --no-color
        working-directory: apps/mixtura/tools/webdav-server
      - name: Front log
        if: failure()
        run: docker compose --profile nginx --profile caddy logs --no-color
        working-directory: apps/mixtura/tools/webdav-front
      - run: docker compose --profile second down -v
        if: always()
        working-directory: apps/mixtura/tools/webdav-server
      - run: docker compose --profile nginx --profile caddy down -v
        if: always()
        working-directory: apps/mixtura/tools/webdav-front

  # Needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. While
  # they are missing the job ends green and says so in its summary, so pull
  # requests stay green until the owner adds them. It deploys the artifact of
  # the same run and starts only after `mixtura-check` passed.
  mixtura-deploy-cloudflare:
    name: mixtura-deploy-cloudflare
    needs: mixtura-check
    # Fork pull requests and Dependabot get no secrets: skip instead of failing.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: mixtura-deploy-cloudflare-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mixtura-dist
          path: apps/mixtura/packages/app/dist

      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, deploy skipped"
            {
              echo "### Cloudflare secrets are not set, deploy skipped"
              echo
              echo "Add the repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` (apps/mixtura/docs/deployment.md, owner steps)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read pinned wrangler version
        if: steps.secrets.outputs.configured == 'true'
        id: wrangler
        run: echo "version=$(node -p "require('./apps/mixtura/tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"

      # `deploy` on main; a Preview named pr-<number> on a pull request
      # (the pull request merge ref has no branch name to default to).
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.configured == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          # The action installs wrangler at the repository root, which would run the
          # install scripts of every workspace dependency; deploying needs none of them.
          npm_config_ignore_scripts: 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.jsonc of Mixtura lives in its folder, not at the root.
          workingDirectory: apps/mixtura
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: ${{ github.event_name == 'push' && 'deploy' || format('preview --name pr-{0}', github.event.pull_request.number) }}

      # A broken deploy fails here instead of going unnoticed: the address must
      # answer with the app and the Content-Security-Policy header.
      - name: Check deployed app
        if: steps.secrets.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::wrangler printed no deployment address"
            exit 1
          fi
          # A descriptive User-Agent: workers.dev refuses default library ones (error 1010).
          agent="mixtura-deploy-check (+https://github.com/nexumia-de/mixtura)"
          curl -fsS -A "$agent" --retry 6 --retry-delay 5 --retry-all-errors -D headers.txt -o page.html "$DEPLOYMENT_URL"
          grep -q 'id="app"' page.html || { echo "::error::no app root at $DEPLOYMENT_URL"; exit 1; }
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" headers.txt || { echo "::error::no Content-Security-Policy header at $DEPLOYMENT_URL"; exit 1; }
          echo "deployed app answers at $DEPLOYMENT_URL"
          {
            echo "### Deployed to Cloudflare"
            echo
            echo "${{ github.event_name == 'push' && 'Production' || 'Preview' }}: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Information only: the custom domain is attached by the owner in the
      # Cloudflare dashboard (apps/mixtura/docs/deployment.md), so it may not answer yet.
      - name: Check custom domain
        if: steps.secrets.outputs.configured == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: |
          if curl -fsS -A "mixtura-deploy-check (+https://github.com/nexumia-de/mixtura)" -m 20 -o /dev/null https://mixtura.nexumia.de/; then
            echo "- https://mixtura.nexumia.de answers" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- https://mixtura.nexumia.de does not answer yet: attach the custom domain (apps/mixtura/docs/deployment.md)" >> "$GITHUB_STEP_SUMMARY"
          fi

  culina-check:
    name: culina-check
    needs: changes
    if: needs.changes.outputs.culina == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:culina

  culina-e2e:
    name: culina-e2e
    needs: culina-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w culina

  # The host adapter (apps/culina/docs/decisions/hosting.md): builds the static folder
  # and hands it to Cloudflare. Only on main, only after both checks.
  culina-deploy:
    name: culina-deploy
    needs: [culina-check, culina-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: culina-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w culina
      - name: Read the pinned wrangler version
        id: wrangler
        run: echo "version=$(node -p "require('./apps/culina/tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        # wrangler.jsonc of Culina lives in its folder, not at the root.
        working-directory: apps/culina
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes "wrangler@${{ steps.wrangler.outputs.version }}" deploy

  emptio-check:
    name: emptio-check
    needs: changes
    if: needs.changes.outputs.emptio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:emptio
