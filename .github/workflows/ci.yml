# One workflow for the whole repository. The job `changes` works out which
# parts a pull request touches, so a change to one app does not run the
# others. Pushes to main run everything.
#
# Parts: model (packages/model), host (packages/host), mixtura, culina, emptio,
# domus (apps/<name>). Mixtura and Culina install the model from this repository, so
# a model change runs them too; the host package uses the model and Mixtura
# uses the host package, so a host change runs Mixtura and a model change runs
# the host package. The shared package of the native Linux apps (packages/gjs)
# uses the host package; a change to it runs Mixtura, Culina and Emptio (their native
# packages), a change to the host package runs it. Emptio does not use the model yet. Domus (the Household
# app at the root of the address) uses the model and the host package, so a
# change to either runs it too, and a change to it runs the site check.
#
# Deploys, on main only: site-deploy (every app under domus.nexumia.de) and
# forward-old-addresses (the earlier addresses of the single apps answer with
# a redirect to it).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A native app's release (emptio-release, mixtura-release, culina-release below).
    tags: ['emptio-v*', 'mixtura-v*', 'culina-v*']

permissions:
  contents: read

jobs:
  # Decides which parts run. A path that belongs to no part (root config,
  # scripts, workflows, anything unknown) runs all of them, so a mistake
  # costs time and not a missed check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      model: ${{ steps.paths.outputs.model }}
      host: ${{ steps.paths.outputs.host }}
      gjs: ${{ steps.paths.outputs.gjs }}
      mixtura: ${{ steps.paths.outputs.mixtura }}
      culina: ${{ steps.paths.outputs.culina }}
      emptio: ${{ steps.paths.outputs.emptio }}
      domus: ${{ steps.paths.outputs.domus }}
    steps:
      # Full history so the base of a pull request is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the parts a change touches
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          model=false; host=false; gjs=false; mixtura=false; culina=false; emptio=false; domus=false
          if [ "$EVENT" != "pull_request" ]; then
            model=true; host=true; gjs=true; mixtura=true; culina=true; emptio=true; domus=true
          else
            # HEAD is the merge of the pull request into its base, so this
            # lists what the pull request changes.
            git diff --name-only "$BASE" HEAD > changed.txt
            echo "Changed files:"; cat changed.txt
            while IFS= read -r file; do
              case "$file" in
                apps/mixtura/*) mixtura=true ;;
                apps/culina/*) culina=true ;;
                apps/emptio/*) emptio=true ;;
                apps/domus/*) domus=true ;;
                packages/gjs/*) gjs=true; mixtura=true; culina=true; emptio=true ;;
                packages/host/*) host=true; gjs=true; mixtura=true; culina=true; emptio=true; domus=true ;;
                packages/model/*) model=true; host=true; gjs=true; mixtura=true; culina=true; emptio=true; domus=true ;;
                LICENSE | *.md) ;;
                *) model=true; host=true; gjs=true; mixtura=true; culina=true; emptio=true; domus=true ;;
              esac
            done < changed.txt
          fi
          {
            echo "model=$model"
            echo "host=$host"
            echo "gjs=$gjs"
            echo "mixtura=$mixtura"
            echo "culina=$culina"
            echo "emptio=$emptio"
            echo "domus=$domus"
          } | tee -a "$GITHUB_OUTPUT"

  # Prettier over the root files and the check that no part reaches into
  # another. Cheap, so it always runs.
  root-checks:
    name: root-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run boundaries

  model-check:
    name: model-check
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:model

  host-check:
    name: host-check
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:host

  # What the native Linux apps share (packages/gjs): the Web Crypto subset against
  # Node's, joining by link, and the lint and types of the tooling. The apps' own
  # native checks (emptio-linux-check, mixtura-linux-check) run it in real GJS.
  gjs-check:
    name: gjs-check
    needs: changes
    if: needs.changes.outputs.gjs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:gjs

  # What an app did when it installed the model from git: npm packs this
  # commit (running prepare) and installs the result into an empty project,
  # which then imports the entry.
  model-pack-install:
    name: model-pack-install
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node packages/model/scripts/consumer-check.mjs

  mixtura-check:
    name: mixtura-check
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:mixtura
      # The build of this commit, for the deploy job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixtura-dist
          path: apps/mixtura/packages/app/dist
          retention-days: 3
          if-no-files-found: error

  mixtura-e2e:
    name: mixtura-e2e
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w mixtura

  # The same scripts on a slow device: CPU slowed 4 times, animation frames
  # delayed by 100 ms (apps/mixtura/docs/development.md#slow-device-pass). Not a required check.
  mixtura-e2e-slow:
    name: mixtura-e2e-slow
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w mixtura
      - run: npm run e2e:slow -w @mixtura/app

  culina-check:
    name: culina-check
    needs: changes
    if: needs.changes.outputs.culina == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:culina

  culina-e2e:
    name: culina-e2e
    needs: culina-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w culina

  emptio-check:
    name: emptio-check
    needs: changes
    if: needs.changes.outputs.emptio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:emptio

  # The browser checks of the shopping list against a fake GitHub API: the
  # list, offline, and two devices sharing a space.
  emptio-e2e:
    name: emptio-e2e
    needs: emptio-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @emptio/app

  # The native Emptio app (GTK4, libadwaita, GJS): the bundle builds, starts
  # in GJS and its desktop file and metainfo validate. The bundle is handed to
  # emptio-flatpak, because Flatpak builds are offline. The steps are the
  # composite action .github/actions/native-linux-check.
  emptio-linux-check:
    name: emptio-linux-check
    needs: emptio-check
    if: needs.changes.outputs.emptio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-linux-check
        with:
          workspace: '@emptio/linux'
          directory: apps/emptio/packages/linux
          app-id: de.nexumia.Emptio
          artifact: emptio-linux-bundle

  # The Flatpak of the native app, x86_64 and aarch64 natively (the steps are the
  # composite action .github/actions/native-flatpak). A tag emptio-v<version> also
  # releases it (emptio-release).
  emptio-flatpak:
    name: emptio-flatpak (${{ matrix.arch }})
    needs: emptio-linux-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-flatpak
        with:
          app-id: de.nexumia.Emptio
          directory: apps/emptio/packages/linux
          arch: ${{ matrix.arch }}
          bundle-artifact: emptio-linux-bundle
          licence-dirs: 'emptio noble-ciphers noble-hashes'
          toolkit-ref: v0.7.2

  # A tag emptio-v<version> releases the native app: the version must be the
  # newest stable <release> in the metainfo (release.toml), and both bundles
  # of the tagged commit go to the GitHub Release of the tag. phosh-apps
  # publishes the newest such release (apps.txt: suitably/domus emptio-v*).
  emptio-release:
    name: emptio-release
    needs: emptio-flatpak
    if: startsWith(github.ref, 'refs/tags/emptio-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-release
        with:
          app: emptio
          title: Emptio
          app-id: de.nexumia.Emptio
          metainfo: apps/emptio/packages/linux/data/de.nexumia.Emptio.metainfo.xml
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-token: ${{ secrets.PUBLISH_TOKEN }}

  # The native Mixtura app (GTK4, libadwaita, GJS): the bundle builds, starts
  # in GJS and its desktop file and metainfo validate. The bundle is handed to
  # mixtura-flatpak, because Flatpak builds are offline. The steps are the
  # composite action .github/actions/native-linux-check.
  mixtura-linux-check:
    name: mixtura-linux-check
    needs: mixtura-check
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-linux-check
        with:
          workspace: '@mixtura/linux'
          directory: apps/mixtura/packages/linux
          app-id: de.nexumia.Mixtura
          artifact: mixtura-linux-bundle

  # The Flatpak of the native app, x86_64 and aarch64 natively (the steps are the
  # composite action .github/actions/native-flatpak). A tag mixtura-v<version> also
  # releases it (mixtura-release).
  mixtura-flatpak:
    name: mixtura-flatpak (${{ matrix.arch }})
    needs: mixtura-linux-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-flatpak
        with:
          app-id: de.nexumia.Mixtura
          directory: apps/mixtura/packages/linux
          arch: ${{ matrix.arch }}
          bundle-artifact: mixtura-linux-bundle
          licence-dirs: 'mixtura noble-ciphers noble-hashes ajv fast-deep-equal bar-assistant'
          toolkit-ref: v0.7.2

  # A tag mixtura-v<version> releases the native app: the version must be the
  # newest stable <release> in the metainfo (release.toml), and both bundles
  # of the tagged commit go to the GitHub Release of the tag. phosh-apps
  # publishes the newest such release (apps.txt: suitably/domus mixtura-v*).
  mixtura-release:
    name: mixtura-release
    needs: mixtura-flatpak
    if: startsWith(github.ref, 'refs/tags/mixtura-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-release
        with:
          app: mixtura
          title: Mixtura
          app-id: de.nexumia.Mixtura
          metainfo: apps/mixtura/packages/linux/data/de.nexumia.Mixtura.metainfo.xml
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-token: ${{ secrets.PUBLISH_TOKEN }}

  # The native Culina app (GTK4, libadwaita, GJS): the bundle builds, starts
  # in GJS and its desktop file and metainfo validate. The bundle is handed to
  # culina-flatpak, because Flatpak builds are offline. The steps are the
  # composite action .github/actions/native-linux-check.
  culina-linux-check:
    name: culina-linux-check
    needs: culina-check
    if: needs.changes.outputs.culina == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-linux-check
        with:
          workspace: '@culina/linux'
          directory: apps/culina/packages/linux
          app-id: de.nexumia.Culina
          artifact: culina-linux-bundle

  # The Flatpak of the native app, x86_64 and aarch64 natively (the steps are the
  # composite action .github/actions/native-flatpak). A tag culina-v<version> also
  # releases it (culina-release).
  culina-flatpak:
    name: culina-flatpak (${{ matrix.arch }})
    needs: culina-linux-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-flatpak
        with:
          app-id: de.nexumia.Culina
          directory: apps/culina/packages/linux
          arch: ${{ matrix.arch }}
          bundle-artifact: culina-linux-bundle
          licence-dirs: 'culina noble-ciphers noble-hashes ajv fast-deep-equal culina-data'
          toolkit-ref: v0.7.2

  # A tag culina-v<version> releases the native app: the version must be the
  # newest stable <release> in the metainfo (release.toml), and both bundles
  # of the tagged commit go to the GitHub Release of the tag. phosh-apps
  # publishes the newest such release (apps.txt: suitably/domus culina-v*).
  culina-release:
    name: culina-release
    needs: culina-flatpak
    if: startsWith(github.ref, 'refs/tags/culina-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-release
        with:
          app: culina
          title: Culina
          app-id: de.nexumia.Culina
          metainfo: apps/culina/packages/linux/data/de.nexumia.Culina.metainfo.xml
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          publish-token: ${{ secrets.PUBLISH_TOKEN }}

  # The Household app at the root of the address: format, lint, typecheck,
  # tests (the bundle, the wording of every failure, the create and join flows).
  domus-check:
    name: domus-check
    needs: changes
    if: needs.changes.outputs.domus == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:domus

  # The browser checks of the Household app against a fake GitHub API: create,
  # invite and join on two devices, every failure in words, 320 to 1200 px.
  domus-e2e:
    name: domus-e2e
    needs: domus-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @domus/app

  # The whole address as it is deployed: every app in its folder. The browser
  # run checks that the apps stay apart (service workers, caches, databases)
  # and that the root app has no manifest and no service worker.
  site-check:
    name: site-check
    needs: changes
    if: needs.changes.outputs.mixtura == 'true' || needs.changes.outputs.culina == 'true' || needs.changes.outputs.emptio == 'true' || needs.changes.outputs.domus == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:site

  # domus.nexumia.de (docs/deployment.md). Only on main; without the secrets
  # the job says so and stays green, as the app deploys do.
  site-deploy:
    name: site-deploy
    needs: [site-check, mixtura-check, culina-check, emptio-check, domus-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, deploy skipped"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci
      - if: steps.secrets.outputs.configured == 'true'
        run: npm run build:site
      - name: Read the pinned wrangler version
        if: steps.secrets.outputs.configured == 'true'
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes "wrangler@${{ steps.wrangler.outputs.version }}" deploy
      # The address must answer with the root page and every app.
      - name: Check the address
        if: steps.secrets.outputs.configured == 'true'
        run: |
          agent="domus-deploy-check"
          for path in / /mixtura/ /culina/ /emptio/; do
            curl -fsS -A "$agent" --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://domus.nexumia.de$path"
            echo "https://domus.nexumia.de$path answers"
          done

  # mixtura.nexumia.de and culina.nexumia.de were the apps' own addresses.
  # Each is now a worker that redirects to the app's folder under the one
  # address (tools/forward), so old links and bookmarks still arrive.
  forward-old-addresses:
    name: forward-old-addresses
    needs: site-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: forward-old-addresses
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: [mixtura, culina]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, deploy skipped"
          fi
      - name: Read the pinned wrangler version
        if: steps.secrets.outputs.configured == 'true'
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Deploy the redirect
        if: steps.secrets.outputs.configured == 'true'
        working-directory: tools/forward
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes "wrangler@${{ steps.wrangler.outputs.version }}" deploy --config "${{ matrix.app }}.jsonc"
      - name: Check the redirect
        if: steps.secrets.outputs.configured == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          want="https://domus.nexumia.de/$APP/"
          for try in 1 2 3 4 5 6; do
            got=$(curl -sS -A "domus-deploy-check" -o /dev/null -w '%{redirect_url}' "https://$APP.nexumia.de/" || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::https://$APP.nexumia.de/ redirects to '$got', not $want"; exit 1; }
          echo "https://$APP.nexumia.de/ redirects to $got"
