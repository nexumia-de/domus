# One workflow for the whole repository. The job `changes` works out which
# parts a pull request touches, so a change to one app does not run the
# others. Pushes to main run everything.
#
# Parts: model (packages/model), host (packages/host), mixtura, culina, emptio,
# domus (apps/<name>). Mixtura and Culina install the model from this repository, so
# a model change runs them too; the host package uses the model and Mixtura
# uses the host package, so a host change runs Mixtura and a model change runs
# the host package. Emptio does not use the model yet. Domus (the Household
# app at the root of the address) uses the model and the host package, so a
# change to either runs it too, and a change to it runs the site check.
#
# Deploys, on main only: site-deploy (every app under domus.nexumia.de) and
# forward-old-addresses (the earlier addresses of the single apps answer with
# a redirect to it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides which parts run. A path that belongs to no part (root config,
  # scripts, workflows, anything unknown) runs all of them, so a mistake
  # costs time and not a missed check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      model: ${{ steps.paths.outputs.model }}
      host: ${{ steps.paths.outputs.host }}
      mixtura: ${{ steps.paths.outputs.mixtura }}
      culina: ${{ steps.paths.outputs.culina }}
      emptio: ${{ steps.paths.outputs.emptio }}
      domus: ${{ steps.paths.outputs.domus }}
    steps:
      # Full history so the base of a pull request is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the parts a change touches
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          model=false; host=false; mixtura=false; culina=false; emptio=false; domus=false
          if [ "$EVENT" != "pull_request" ]; then
            model=true; host=true; mixtura=true; culina=true; emptio=true; domus=true
          else
            # HEAD is the merge of the pull request into its base, so this
            # lists what the pull request changes.
            git diff --name-only "$BASE" HEAD > changed.txt
            echo "Changed files:"; cat changed.txt
            while IFS= read -r file; do
              case "$file" in
                apps/mixtura/*) mixtura=true ;;
                apps/culina/*) culina=true ;;
                apps/emptio/*) emptio=true ;;
                apps/domus/*) domus=true ;;
                packages/host/*) host=true; mixtura=true; culina=true; emptio=true; domus=true ;;
                packages/model/*) model=true; host=true; mixtura=true; culina=true; emptio=true; domus=true ;;
                LICENSE | *.md) ;;
                *) model=true; host=true; mixtura=true; culina=true; emptio=true; domus=true ;;
              esac
            done < changed.txt
          fi
          {
            echo "model=$model"
            echo "host=$host"
            echo "mixtura=$mixtura"
            echo "culina=$culina"
            echo "emptio=$emptio"
            echo "domus=$domus"
          } | tee -a "$GITHUB_OUTPUT"

  # Prettier over the root files and the check that no part reaches into
  # another. Cheap, so it always runs.
  root-checks:
    name: root-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run boundaries

  model-check:
    name: model-check
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:model

  host-check:
    name: host-check
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:host

  # What an app did when it installed the model from git: npm packs this
  # commit (running prepare) and installs the result into an empty project,
  # which then imports the entry.
  model-pack-install:
    name: model-pack-install
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node packages/model/scripts/consumer-check.mjs

  mixtura-check:
    name: mixtura-check
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:mixtura
      # The build of this commit, for the deploy job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixtura-dist
          path: apps/mixtura/packages/app/dist
          retention-days: 3
          if-no-files-found: error

  mixtura-e2e:
    name: mixtura-e2e
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w mixtura

  # The same scripts on a slow device: CPU slowed 4 times, animation frames
  # delayed by 100 ms (apps/mixtura/docs/development.md#slow-device-pass). Not a required check.
  mixtura-e2e-slow:
    name: mixtura-e2e-slow
    needs: changes
    if: needs.changes.outputs.mixtura == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w mixtura
      - run: npm run e2e:slow -w @mixtura/app

  culina-check:
    name: culina-check
    needs: changes
    if: needs.changes.outputs.culina == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:culina

  culina-e2e:
    name: culina-e2e
    needs: culina-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w culina

  emptio-check:
    name: emptio-check
    needs: changes
    if: needs.changes.outputs.emptio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:emptio

  # The browser checks of the shopping list against a fake GitHub API: the
  # list, offline, and two devices sharing a space.
  emptio-e2e:
    name: emptio-e2e
    needs: emptio-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @emptio/app

  # The native Linux app (GTK4, libadwaita, GJS): the bundle builds, starts
  # in GJS and its desktop file and metainfo validate. The bundle is handed to
  # emptio-flatpak, because Flatpak builds are offline.
  emptio-linux-check:
    name: emptio-linux-check
    needs: emptio-check
    if: needs.changes.outputs.emptio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install GJS, GTK, libadwaita and the metadata validators
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 update -q
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y -q \
            gjs gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-soup-3.0 desktop-file-utils appstream
      - run: npm ci
      - run: npm run build -w @emptio/linux
      - run: npm run smoke -w @emptio/linux
      - name: Validate the desktop file and the metainfo
        run: |
          desktop-file-validate apps/emptio/packages/linux/data/*.desktop
          appstreamcli validate --no-net apps/emptio/packages/linux/data/*.metainfo.xml
          # Phosh hides an app without the form factor; the validator does not catch it.
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' apps/emptio/packages/linux/data/*.desktop
      # The bundle of this commit, for the Flatpak job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emptio-linux-bundle
          path: apps/emptio/packages/linux/dist/de.nexumia.Emptio.js
          retention-days: 3
          if-no-files-found: error

  # The Flatpak of the native app, x86_64 and aarch64 natively. The reusable
  # workflow of phosh-toolkit is not used: it checks the repository out and
  # builds in it, with no step before it, so a bundle that npm builds cannot
  # reach the offline build, and its REUSE gate needs files this repository
  # does not have (no REUSE.toml, no docs/dependencies.md). Same tooling and
  # steps otherwise. First build only: no release, no nightly, no publishing.
  emptio-flatpak:
    name: emptio-flatpak (${{ matrix.arch }})
    needs: emptio-linux-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      APP_ID: de.nexumia.Emptio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emptio-linux-bundle
          path: apps/emptio/packages/linux/dist
      - name: Install Flatpak tooling
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          # librsvg2-common: the SVG pixbuf loader "appstreamcli compose" needs
          # for the icon; elfutils: eu-strip. Both are only Recommends.
          "${apt[@]}" install -y -q --no-install-recommends \
            flatpak flatpak-builder librsvg2-common elfutils
          # Ubuntu 24.04 restricts the user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --arch=${{ matrix.arch }} --bundle-sources --repo=repo \
            build-dir apps/emptio/packages/linux/de.nexumia.Emptio.yml
      - name: Check licence files
        run: |
          for dir in emptio noble-ciphers noble-hashes; do
            files=$(find "build-dir/files/share/licenses/$APP_ID/$dir" -mindepth 1 -printf '%P ' 2>/dev/null || true)
            [ -n "$files" ] || { echo "::error::No licence files in /app/share/licenses/$APP_ID/$dir"; exit 1; }
            echo "$dir: $files"
          done
      - name: Bundle
        run: |
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$APP_ID-${{ matrix.arch }}.flatpak" "$APP_ID"
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime \
            repo "$APP_ID-sources-${{ matrix.arch }}.flatpak" "$APP_ID.Sources"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: de.nexumia.Emptio-${{ matrix.arch }}
          path: |
            de.nexumia.Emptio-${{ matrix.arch }}.flatpak
            de.nexumia.Emptio-sources-${{ matrix.arch }}.flatpak
          retention-days: 14
          if-no-files-found: error

  # The Household app at the root of the address: format, lint, typecheck,
  # tests (the bundle, the wording of every failure, the create and join flows).
  domus-check:
    name: domus-check
    needs: changes
    if: needs.changes.outputs.domus == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:domus

  # The browser checks of the Household app against a fake GitHub API: create,
  # invite and join on two devices, every failure in words, 320 to 1200 px.
  domus-e2e:
    name: domus-e2e
    needs: domus-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @domus/app

  # The whole address as it is deployed: every app in its folder. The browser
  # run checks that the apps stay apart (service workers, caches, databases)
  # and that the root app has no manifest and no service worker.
  site-check:
    name: site-check
    needs: changes
    if: needs.changes.outputs.mixtura == 'true' || needs.changes.outputs.culina == 'true' || needs.changes.outputs.emptio == 'true' || needs.changes.outputs.domus == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:site

  # domus.nexumia.de (docs/deployment.md). Only on main; without the secrets
  # the job says so and stays green, as the app deploys do.
  site-deploy:
    name: site-deploy
    needs: [site-check, mixtura-check, culina-check, emptio-check, domus-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, deploy skipped"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci
      - if: steps.secrets.outputs.configured == 'true'
        run: npm run build:site
      - name: Read the pinned wrangler version
        if: steps.secrets.outputs.configured == 'true'
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes "wrangler@${{ steps.wrangler.outputs.version }}" deploy
      # The address must answer with the root page and every app.
      - name: Check the address
        if: steps.secrets.outputs.configured == 'true'
        run: |
          agent="domus-deploy-check"
          for path in / /mixtura/ /culina/ /emptio/; do
            curl -fsS -A "$agent" --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://domus.nexumia.de$path"
            echo "https://domus.nexumia.de$path answers"
          done

  # mixtura.nexumia.de and culina.nexumia.de were the apps' own addresses.
  # Each is now a worker that redirects to the app's folder under the one
  # address (tools/forward), so old links and bookmarks still arrive.
  forward-old-addresses:
    name: forward-old-addresses
    needs: site-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: forward-old-addresses
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: [mixtura, culina]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set, deploy skipped"
          fi
      - name: Read the pinned wrangler version
        if: steps.secrets.outputs.configured == 'true'
        id: wrangler
        run: echo "version=$(node -p "require('./tools/wrangler/package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Deploy the redirect
        if: steps.secrets.outputs.configured == 'true'
        working-directory: tools/forward
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes "wrangler@${{ steps.wrangler.outputs.version }}" deploy --config "${{ matrix.app }}.jsonc"
      - name: Check the redirect
        if: steps.secrets.outputs.configured == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          want="https://domus.nexumia.de/$APP/"
          for try in 1 2 3 4 5 6; do
            got=$(curl -sS -A "domus-deploy-check" -o /dev/null -w '%{redirect_url}' "https://$APP.nexumia.de/" || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::https://$APP.nexumia.de/ redirects to '$got', not $want"; exit 1; }
          echo "https://$APP.nexumia.de/ redirects to $got"
