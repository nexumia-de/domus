# Weekly pull requests for new versions of npm packages and GitHub
# Actions; every version is pinned exactly (phosh-toolkit
# docs/dependency-updates.md). One npm workspace at the root covers the
# model and all apps; the folders below are not workspaces.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Node types follow the Node version in .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The wrangler version the site deploy job uses.
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: weekly
    versioning-strategy: increase
  # The wrangler version the Mixtura deploy job uses.
  - package-ecosystem: npm
    directory: /apps/mixtura/tools/wrangler
    schedule:
      interval: weekly
  # The wrangler version the Culina deploy job uses.
  - package-ecosystem: npm
    directory: /apps/culina/tools/wrangler
    schedule:
      interval: weekly
    versioning-strategy: increase
  # The WebDAV server image of the sync tests and the user setup.
  - package-ecosystem: docker-compose
    directory: /apps/mixtura/tools/webdav-server
    schedule:
      interval: weekly
  # The reverse-proxy images that add CORS in front of a WebDAV server.
  - package-ecosystem: docker-compose
    directory: /apps/mixtura/tools/webdav-front
    schedule:
      interval: weekly
