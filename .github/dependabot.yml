# Weekly pull requests for new versions of npm packages and GitHub
# Actions; every version is pinned exactly (phosh-toolkit
# docs/dependency-updates.md). One npm workspace at the root covers the
# model and all apps; the folders below are not workspaces.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Node types follow the Node version in .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The wrangler version the deploy jobs use.
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: weekly
    versioning-strategy: increase
