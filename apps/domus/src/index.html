<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page connects to itself and to GitHub's API. `https:` is there because a WebDAV
      storage is a server of the household's own choosing, at an address nobody can list here
      (as in Mixtura's policy); plain http is not allowed. Nothing else is loaded: no
      inline script or style, images only from the page itself (the QR code is an inline SVG).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.github.com https:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>Household</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Household needs JavaScript.</noscript>
  </body>
</html>
