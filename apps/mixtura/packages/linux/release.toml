# Releases of the native app with the toolkit's release.py (docs/releases.md
# in phosh-toolkit). The version lives only in the metainfo; build.mjs reads
# it for the About dialog. Releases are automatic: .github/workflows/release.yml
# turns the fragments into a pull request "Release mixtura-v<version>"; merging it
# tags mixtura-v<version>.
metainfo = "data/de.nexumia.Mixtura.metainfo.xml"
fragments = "changelog.d"
tag-prefix = "mixtura-v"

# Screenshots the Flatpak job takes from the built app (docs/releases.md in
# phosh-toolkit): the recorded data of scripts/seed.mjs, which the check job
# writes to dist/screenshot-data. Locally:
#   node scripts/seed.mjs dist/screenshot-data en
[screenshots]
env = { MIXTURA_DATA_DIR = "{root}/dist/screenshot-data" }
expose = ["{root}/dist/screenshot-data"]

[[screenshots.shot]]
name = "drinks"
caption = "All drinks, with what is missing for each"
