# Weekly pull requests for new versions of npm packages and GitHub
# Actions; every version is pinned exactly (phosh-toolkit
# docs/dependency-updates.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Node types follow the Node version in .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The wrangler version the deploy job uses (tools/wrangler/package.json).
  - package-ecosystem: npm
    directory: /tools/wrangler
    schedule:
      interval: weekly
  # The WebDAV server image of the sync tests and the user setup (tools/webdav-server).
  - package-ecosystem: docker-compose
    directory: /tools/webdav-server
    schedule:
      interval: weekly
