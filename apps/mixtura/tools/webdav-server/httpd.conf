# A minimal WebDAV server for Mixtura (docs/sync-backends.md): one folder,
# basic auth, ETags, conditional PUT, and the CORS answers a browser page
# needs. Everything outside this file is Apache's default.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %>s \"%r\" origin=%{Origin}i" mixtura
CustomLog /proc/self/fd/1 mixtura
TypesConfig conf/mime.types
DocumentRoot "/var/dav/files"
DavLockDB "/var/dav/lock/db"

# Only origins that match get CORS headers. The entrypoint sets the regular
# expression; the browser never sends credentials on the preflight, so it is
# answered here, before authentication.
SetEnvIf Origin "${ALLOWED_ORIGINS_REGEX}" MIXTURA_ORIGIN=$0
Header always set Access-Control-Allow-Origin "%{MIXTURA_ORIGIN}e" env=MIXTURA_ORIGIN
Header always set Access-Control-Allow-Methods "GET, PUT, MKCOL, PROPFIND, OPTIONS" env=MIXTURA_ORIGIN
Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Depth, If-Match, If-None-Match" env=MIXTURA_ORIGIN
Header always set Access-Control-Expose-Headers "ETag" env=MIXTURA_ORIGIN
Header always set Access-Control-Max-Age "600" env=MIXTURA_ORIGIN
Header always merge Vary "Origin"

<Directory "/var/dav/files">
    Dav On
    # Without this a folder answers GET with a listing; nothing needs it.
    Options None
    AuthType Basic
    AuthName "Mixtura WebDAV"
    AuthUserFile "/var/dav/users.passwd"
    Require valid-user
</Directory>

<If "%{REQUEST_METHOD} == 'OPTIONS' && -n req('Access-Control-Request-Method')">
    Redirect 204
</If>
